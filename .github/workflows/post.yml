name: Post Diary Question

on:
  schedule:
    # JST 8/10/12/14/16/18/20/22 = UTC 23/1/3/5/7/9/11/13
    - cron: '0 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:
    inputs:
      hour:
        description: 'Hour in JST (8/10/12/14/16/18/20/22). Empty = current JST hour.'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Post question
        run: bash .hestia/scripts/post.sh ${{ github.event.inputs.hour }}
